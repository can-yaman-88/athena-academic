services:
  api_service:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: athena_api
    ports:
      # host 8888 -> container 8000 (uvicorn listens on 8000 inside the image).
      - "8888:8000"
    environment:
      # Pass through the OpenRouter key from the host/.env (empty disables /chat).
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      # Origins allowed to call the API (consumed by config.py). MUST match the
      # address the browser actually uses to load the frontend. On a remote server
      # set CORS_ORIGINS in .env, e.g. CORS_ORIGINS=http://<server-ip>:8088
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8088}
    volumes:
      # Persist SQLite (data/athena.db) and ChromaDB (data/chroma) across restarts.
      - ./data:/app/data
    restart: unless-stopped

  frontend_service:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the static bundle at BUILD time (Vite inlines VITE_* vars), so
        # this must be the address the BROWSER can reach the API at — NOT the
        # container's localhost. On a remote server set VITE_API_URL in .env, e.g.
        # VITE_API_URL=http://<server-ip>:8888 , then rebuild with --build.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8888}
    container_name: athena_frontend
    ports:
      # host 8088 -> container 80 (nginx listens on 80 inside the image).
      - "8088:80"
    depends_on:
      - api_service
    restart: unless-stopped
