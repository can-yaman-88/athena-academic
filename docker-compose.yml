services:
  api_service:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: athena_api
    ports:
      # host 8888 -> container 8000 (uvicorn listens on 8000 inside the image).
      - "8888:8000"
    environment:
      # Pass through the OpenRouter key from the host/.env (empty disables /chat).
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      # Origins allowed to call the API (consumed by config.py). MUST match the
      # address the browser actually uses to load the frontend. On a remote server
      # set CORS_ORIGINS in .env, e.g. CORS_ORIGINS=http://<server-ip>:8088
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8088}
      # Deep Research web search backend. SearXNG runs as the `searxng` service
      # below, reachable by name on the compose network. Override in .env if you
      # point at a different instance.
      - SEARXNG_URL=${SEARXNG_URL:-http://searxng:8080}
    extra_hosts:
      # Lets the container reach a HOST-run service if ever needed (no-op on
      # Docker Desktop).
      - "host.docker.internal:host-gateway"
    volumes:
      # Persist SQLite (data/athena.db) and ChromaDB (data/chroma) across restarts.
      - ./data:/app/data
      # Share the host's ChromaDB embedding-model cache (all-MiniLM-L6-v2, ~80MB)
      # so it is NOT re-downloaded on every container (re)build. Without this the
      # first chat/brain call hangs while the model downloads from S3, which the
      # browser surfaces as "NetworkError". The host already has it cached.
      - ${HOME}/.cache/chroma:/root/.cache/chroma
    depends_on:
      - searxng
    restart: unless-stopped

  frontend_service:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the static bundle at BUILD time (Vite inlines VITE_* vars), so
        # this must be the address the BROWSER can reach the API at — NOT the
        # container's localhost. On a remote server set VITE_API_URL in .env, e.g.
        # VITE_API_URL=http://<server-ip>:8888 , then rebuild with --build.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8888}
    container_name: athena_frontend
    ports:
      # host 8088 -> container 80 (nginx listens on 80 inside the image).
      - "8088:80"
    depends_on:
      - api_service
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    volumes:
      # Mount only our tracked config file; the rest of /etc/searxng (uwsgi.ini
      # etc.) is provided by the image. Keeping this in a repo-owned dir (not a
      # container-created one) means it ships with the clone on a fresh server.
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://${SEARXNG_HOSTNAME:-localhost}:8080/
      - SEARXNG_SEARCH_FORMATS=html,json
    restart: unless-stopped
